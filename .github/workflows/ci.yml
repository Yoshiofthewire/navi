name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Xwayland probes EGL even when the headless integration test uses software rendering.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev pkg-config libudev-dev libinput-dev libseat-dev libgbm-dev libdrm-dev xwayland libegl1 libgl1-mesa-dri libegl-mesa0 swaylock meson ninja-build wayland-protocols libcairo2-dev libgtk-3-dev libpam0g-dev curl patch python3-gi gir1.2-gtk-4.0 gir1.2-gtk-3.0 librsvg2-common adwaita-icon-theme shared-mime-info fonts-noto-core thunar dbus-daemon xdg-dbus-proxy libsecret-tools gir1.2-secret-1 network-manager-gnome xvfb gettext
      - name: Rust toolchain
        id: toolchain
        run: |
          rustup show
          echo "version=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-check-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-check-${{ steps.toolchain.outputs.version }}-
      - name: Real oo7, libsecret and native NetworkManager agent (private bus/display)
        run: |
          navi_test_daemon=$(bash scripts/build-oo7-test.sh)
          python3 scripts/check-secrets.py --daemon "$navi_test_daemon" --nm-applet /usr/bin/nm-applet --xvfb /usr/bin/Xvfb --output "$RUNNER_TEMP/navi-secrets-check"
      - name: Settings model checks
        run: python3 -X faulthandler -m unittest discover -s src/settings -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Notification-only sandbox isolation (private D-Bus, no display)
        run: cargo test --locked dbus::tests::notification_only_proxy_isolation -- --ignored
      - name: XWayland integration (no host display or GPU)
        run: cargo test --locked xwayland::tests::x11_lifecycle_and_input -- --ignored
      - name: Swaylock protocol handshake (no host display or authentication)
        run: cargo test --locked locking::tests::swaylock_real_client_handshake -- --ignored
      - name: Eight-slice locker protocol handshake
        run: NAVI_TEST_SWAYLOCK="$PWD/target/debug/navi-swaylock" cargo test --locked locking::tests::swaylock_real_client_handshake -- --ignored
      - run: cargo build --locked
      - name: Native utility themes and real Thunar operations (private bus/display)
        run: python3 scripts/check-utilities.py --output "$RUNNER_TEMP/navi-utility-check"
      - name: Preserve native utility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-utility-check
          path: |
            ${{ runner.temp }}/navi-utility-check/*.png
            ${{ runner.temp }}/navi-utility-check/results.json
            ${{ runner.temp }}/navi-utility-check/services.log
          if-no-files-found: ignore
          retention-days: 7
      # No display and no seat: navi must take the real-hardware path and exit 1 with its
      # message, not hang (124), panic (101) or succeed.
      - name: Fail-safe smoke
        run: |
          test "$(id -u)" -ne 0
          code=0
          env -u WAYLAND_DISPLAY -u DISPLAY timeout 20 target/debug/navi 2> err.txt || code=$?
          cat err.txt
          echo "exit status $code, uid $(id -u)"
          test "$code" = 1
          grep -F 'navi: cannot start on real hardware:' err.txt
      - name: Preserve isolated secrets diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secrets-check-diagnostics
          path: |
            ${{ runner.temp }}/navi-secrets-check/services.log
            ${{ runner.temp }}/navi-secrets-check/results.json
          if-no-files-found: ignore
          retention-days: 7
